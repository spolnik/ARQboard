services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arqboard
      POSTGRES_USER: arqboard
      POSTGRES_PASSWORD: arqboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqboard -d arqboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
