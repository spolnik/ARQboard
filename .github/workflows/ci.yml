name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: mkdir -p coverage && go test ./... -covermode=atomic -coverprofile=coverage/go.out
      - run: go tool cover -func=coverage/go.out | tee coverage/go-summary.txt
      - run: npm ci
        working-directory: web
      - run: npm run test:coverage
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node .github/scripts/coverage-summary.mjs
      - run: node .github/scripts/check-coverage.mjs
      - run: docker build -t arqboard:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/go.out
            coverage/go-summary.txt
            coverage/coverage-comment.md
            web/coverage/coverage-summary.json
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- arqboard-coverage-report -->';
            const body = fs.readFileSync('coverage/coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
